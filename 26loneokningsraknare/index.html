
<!DOCTYPE html>
<html lang="sv">
<head>

  <title>Har din lön hängt med?</title>
  <link rel="stylesheet" href="jamfor.css" type="text/css">
  <link rel="stylesheet" href="../arbetet_assets/stylesheets/arbetet.css" type="text/css">

<body class="Body">
  <div id="content" class="BodyImage-caption">

  <h2 id="storRubrik">Har din lön hängt med?</h2>

  <p>
    Jämför din löneutveckling med den genomsnittliga
    utvecklingen för kommunanställda anläggningsarbetare, renhållningsarbetare och trädgårdsanläggare.
    <!-- Jämför din löneutveckling med den genomsnittliga
    utvecklingen för kommunanställda <span id="yrkeText" class="fet"></span>. -->
  </p>

  <label for="yrke">Välj yrke</label>
  <select id="yrke" class="BodyImage-caption">
    <option class="BodyImage-caption" value="anlaggning">Anläggningsarbetare</option>
    <option class="BodyImage-caption" value="kyrkvakt">Kyrkvaktmästare</option>
    <option class="BodyImage-caption" value="kyrkogard">Kyrkogårdsarbetare</option>
    <option class="BodyImage-caption" value="renhallning">Renhållningsarbetare</option>
    <option class="BodyImage-caption" value="tradgard">Trädgårdsanläggare</option>
  </select>


  <label for="ar">Välj startår</label>
  <select id="ar" class="BodyImage-caption"></select>

  <label for="startlon">Skriv in din månadslön det året</label>
  <input type="number" id="startlon" value="25000" min="1" class="initial-value BodyImage-caption">
  <p><small>Genomsnittlig månadslön: <span id="genomsnittLon"></span></small></p>

  <label for="slutlon">Skriv in din månadslön 2025</label>
  <input type="number" id="slutlon" value="32000" min="3" class="initial-value BodyImage-caption">
  <p><small>Genomsnittlig månadslön: <span id="genomsnittLonSlut"></span></small></p>

  <div id="resultat" aria-live="polite">
    <!-- <h2>Din löneutveckling</h2> -->

    <p>Din ökning: <span class="storFet" id="egenProcent"></span></p>
    <!-- <div class="stapel">
      <div class="fyllning" id="egenStapel"></div>
    </div> -->

    <p>Genomsnittlig ökning: <span class="storFet" id="snittProcent"></span></p>
    <!-- <div class="stapel">
      <div class="fyllning" id="snittStapel"></div>
    </div> -->
    <hr>
    <p id="jamforelse"></p>
  </div>

  </div> 



  <script src="../iframe-helper/iframe-helper.js"></script>
  <script type="text/javascript" src="jamfor.js"></script>

</body>
</html>
