
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <title>Lönekarta</title>
  <script src="https://d3js.org/d3.v5.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; }
    path { stroke: white; stroke-width: 1; }
    path:hover { stroke: black; stroke-width: 2; }
    #tooltip {
      position: absolute;
      background: white;
      padding: 10px;
      border: 1px solid #aaa;
      pointer-events: none;
      display: none;
    }
  </style>
</head>
<body>

<h2>Lön för anläggningsarbetare</h2>
<svg width="500" height="700"></svg>
<div id="tooltip"></div>

<script>
const loner = {
  SE11: 38500,
  SE12: 35200,
  SE21: 34100,
  SE22: 35800,
  SE23: 37200,
  SE31: 33900,
  SE32: 36100,
  SE33: 37400
};

const svg = d3.select("svg");
const tooltip = d3.select("#tooltip");

d3.json("Sverige_NUTS2_2024.geojson").then(data => {

  // const projection = d3.geoMercator()
    const projection = d3.geoConicEqualArea()

    .fitSize([500, 700], data);

  const path = d3.geoPath().projection(projection);

  const color = d3.scaleSequential(d3.interpolateBlues)
    .domain([33000, 39000]);

  svg.selectAll("path")
    .data(data.features)
    .enter()
    .append("path")
    .attr("d", path)
    .attr("fill", d => color(loner[d.properties.NUTS_ID]))
    .on("mouseover", function(d) {
      const kod = d.properties.NUTS_ID;
      const namn = d.properties.NAME_LATN;

      tooltip
        .style("display", "block")
        .html(`Lön för anläggningsarbetare i
          ${namn}: <b>${loner[kod].toLocaleString("sv-SE")}
          kr/månad</b>`);
    })
    .on("mousemove", function() {
      tooltip
        .style("left", (d3.event.pageX + 15) + "px")
        .style("top", (d3.event.pageY + 15) + "px");
    })
    .on("mouseout", function() {
      tooltip.style("display", "none");
    });

});
</script>

</body>
</html>
